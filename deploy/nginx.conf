# =============================================================================
# Nginx Config — Production reverse proxy for Viraleo
# =============================================================================
# How to use:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/viraleo
#   sudo ln -s /etc/nginx/sites-available/viraleo /etc/nginx/sites-enabled/
#   sudo nginx -t        # verify syntax
#   sudo systemctl reload nginx
# =============================================================================

# ─── Rate limiting zones (defined at http level) ──
# Add to /etc/nginx/nginx.conf http block:
#   limit_req_zone  $binary_remote_addr  zone=api:10m     rate=30r/s;
#   limit_req_zone  $binary_remote_addr  zone=general:10m rate=100r/s;

# ─── Upstream (Node.js server) ──────────────────────────────────────────────
upstream viraleo_node {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name viraleo.pro www.viraleo.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name viraleo.pro www.viraleo.pro;

    # SSL (generate with: sudo certbot --nginx -d viraleo.pro -d www.viraleo.pro)
    ssl_certificate     /etc/letsencrypt/live/viraleo.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viraleo.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (force HTTPS for 1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client limits (50MB for thumbnail uploads)
    client_max_body_size 50M;
    client_body_timeout 60s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Logs
    access_log /var/log/nginx/viraleo-access.log;
    error_log  /var/log/nginx/viraleo-error.log;

    # ── Proxy everything to Node.js (Nitro handles SSR + static files) ──
    location / {
        proxy_pass http://viraleo_node;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── API routes (longer timeout for ML processing) ──
    location /api/ {
        proxy_pass http://viraleo_node;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ML analysis can take 30+ seconds
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
